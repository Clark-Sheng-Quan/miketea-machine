services:
  # Node.js Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miketea-backend-prod
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - /var/log/miketea-machine:/var/log/miketea-machine
    networks:
      - miketea-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: miketea-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - /var/log/nginx:/var/log/nginx
    depends_on:
      - backend
    networks:
      - miketea-network
    restart: always

networks:
  miketea-network:
    driver: bridge
