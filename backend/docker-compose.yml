services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miketea-backend
    env_file:
      - ./.env
    mem_limit: 256m
    ports:
      - "3000:3000"
    networks:
      - miketea-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  miketea-network:
    driver: bridge
